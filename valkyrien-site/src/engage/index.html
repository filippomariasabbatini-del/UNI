<!doctype html>
<html lang="en-GB">
<head>
  <!-- @include partials/head.html -->
  <title>Request a qualification call | Valkyrien Holding</title>
  <meta name="description" content="Start a qualification with Valkyrien Holding: legal entity, jurisdiction and objective. We respond within 24 business hours; all requests pass internal compliance screening.">
  <link rel="canonical" href="https://valkyrien.co.uk/engage/">
</head>
<body>
  <!-- @include partials/header.html current="engage" -->

  <main id="main">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="container">
        <p class="eyebrow">Engage</p>
        <h1 id="page-title">Request a Qualification Call</h1>
        <p>Three fields to start. We respond within 24 business hours. All requests pass internal compliance screening.</p>
      </div>
    </section>

    <section class="section" id="qualification" aria-labelledby="form-title">
      <div class="container">
        <h2 id="form-title">Pre-qualification</h2>
        <!-- Task 4: endpoint, validation and privacy consent. No submission until the Privacy Notice is published. -->
        <form action="#" method="post" novalidate data-qualification-form>
          <p>
            <label for="f-entity">Legal entity name</label>
            <input id="f-entity" name="legal_entity" type="text" autocomplete="organization" required>
          </p>
          <p>
            <label for="f-jurisdiction">Jurisdiction of incorporation</label>
            <input id="f-jurisdiction" name="jurisdiction" type="text" autocomplete="country-name" required>
          </p>
          <p>
            <label for="f-objective">Objective</label>
            <textarea id="f-objective" name="objective" rows="4" required></textarea>
          </p>
          <p>
            <button class="btn" type="submit" disabled>Request a Qualification Call</button>
          </p>
        </form>
      </div>
    </section>
  </main>

  <!-- @include partials/footer.html -->
</body>
</html>
