<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__id">
      <svg class="brand__mark brand__mark--static" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect class="brand__frame" pathLength="1" x="1.75" y="1.75" width="28.5" height="28.5" rx="1.5"/><path class="brand__outer" pathLength="1" d="M7 8.5 16 25 25 8.5"/><path class="brand__inner" pathLength="1" d="M12 8.5 16 16 20 8.5"/></svg>
      <address class="site-footer__legal">
        Valkyrien Holding Ltd · {{t:footer.registered}} · <span class="nowrap">{{t:footer.companyNo}}</span><br>
        {{t:footer.office}}<br>
        {{t:footer.copyright}}
      </address>
    </div>
    <nav aria-label="{{t:footer.aria}}">
      <ul class="site-footer__links">
        <li><a href="/compliance/#sanctions">{{t:policy.sanctions}}</a></li>
        <li><a href="/compliance/#aml">{{t:footer.aml}}</a></li>
        <li><a href="/compliance/#anti-bribery">{{t:footer.antiBribery}}</a></li>
        <li><a href="/compliance/#code-of-conduct">{{t:policy.conduct}}</a></li>
        <li><a href="/compliance/#privacy">{{t:policy.privacy}}</a></li>
        <li><a href="/compliance/#legal-notice">{{t:policy.legal}}</a></li>
      </ul>
    </nav>
  </div>
</footer>
